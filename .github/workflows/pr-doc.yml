name: PR Documentation

on:
  pull_request:
    types: [opened, edited, synchronize, closed, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          config-path: .pr-doc.yml
